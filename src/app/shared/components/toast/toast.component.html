@if (currentToast()) {
  <aside class="toast-container" [class]="'toast-' + currentToast()?.type" role="alert">
    <div class="toast-icon">
      @if (currentToast()?.type === 'success') {
        <app-icon name="check" [size]="20" />
      } @else if (currentToast()?.type === 'error') {
        <app-icon name="x" [size]="20" />
      } @else {
        <app-icon name="info" [size]="20" />
      }
    </div>
    <div class="toast-content">
      <h4 class="toast-title">{{ currentToast()?.title }}</h4>
      <p class="toast-message">{{ currentToast()?.message }}</p>
    </div>
    <button type="button" class="toast-close" (click)="dismiss()" aria-label="Close notification">
      <app-icon name="x" [size]="16" />
    </button>
  </aside>
}
