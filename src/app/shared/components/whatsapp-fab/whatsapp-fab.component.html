<aside class="whatsapp-fab-container" aria-label="Quick WhatsApp Contact">
  <div class="whatsapp-tooltip">
    <span class="tooltip-title">Chat with Dr. Yewale's Clinic</span>
    <span class="tooltip-sub">Instant Appointment & Inquiries</span>
  </div>
  <a 
    [href]="getWhatsAppLink()" 
    target="_blank" 
    rel="noopener noreferrer" 
    class="whatsapp-fab-button"
    aria-label="Chat on WhatsApp with Dr. Yewale's Clinic"
  >
    <div class="pulse-ring"></div>
    <app-icon name="message-circle" [size]="30" />
  </a>
</aside>
