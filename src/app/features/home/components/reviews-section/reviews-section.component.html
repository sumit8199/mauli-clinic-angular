<section id="reviews" class="section-py reviews-section scroll-mt-header">
  <div class="container">
    <app-section-header 
      badge="Patient Stories" 
      title="Trusted by Nashik Parents" 
      subtitle="Read genuine feedback from parents who trust Dr. Suraj Yewale for their children's health, vaccinations, and routine medical care."
    />

    <div class="reviews-grid">
      @for (review of testimonials(); track review.id) {
        <div class="review-card">
          <!-- Stars -->
          <div class="review-rating-stars">
            @for (s of [1, 2, 3, 4, 5]; track s) {
              <app-icon name="star" [size]="16" customClass="star-icon-filled" />
            }
          </div>

          <p class="review-text">"{{ review.comment }}"</p>

          <div class="review-author-meta">
            <div class="author-avatar">
              {{ review.parentName.charAt(0) }}
            </div>
            <div class="author-details">
              <h4 class="author-name">{{ review.parentName }}</h4>
              <p class="author-child-info">{{ review.childInfo }}</p>
              <span class="author-location">
                <app-icon name="map-pin" [size]="12" />
                <span>{{ review.location }}</span>
              </span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
